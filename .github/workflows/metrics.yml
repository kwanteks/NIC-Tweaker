# NicTuner Metrics — regenerates nictuner-metrics.svg via lowlighter/metrics.
#
# Token: uses secrets.GH_PAT when set, otherwise github.token (no secret required).
# Optional GH_PAT (classic or fine-grained): read:user, read:org, repo
#   Needed only for plugin_traffic (GitHub traffic API requires a PAT with push access).
name: NicTuner Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: nictuner-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Generate metrics SVG
        uses: lowlighter/metrics@v3.34
        with:
          # Empty GH_PAT was failing the job; github.token is enough for repo metrics.
          token: ${{ secrets.GH_PAT || github.token }}
          # Save via git commit below — API save can drop the existing file SHA.
          output_action: none
          filename: nictuner-metrics.svg
          template: repository
          user: kwanteks
          repo: NIC-Tweaker
          config_timezone: America/Indiana/Indianapolis
          plugin_lines: yes
          plugin_languages: yes
          plugin_languages_ignored: markdown, plaintext, text
          plugin_followup: yes
          plugin_contributors: yes
          plugin_stargazers: yes
          # Off by default: traffic API rejects github.token. Set GH_PAT + flip to yes to enable.
          plugin_traffic: no

      - name: Copy SVG to repo root
        run: |
          test -s /metrics_renders/nictuner-metrics.svg
          cp /metrics_renders/nictuner-metrics.svg ./nictuner-metrics.svg

      - name: Commit metrics SVG
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: 'Update nictuner-metrics.svg - [Skip GitHub Action]'
          file_pattern: nictuner-metrics.svg
