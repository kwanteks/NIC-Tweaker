# Builds the self-contained WinUI app + Inno Setup installer (same path as .\build.ps1).
name: installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # WinUI PRI tasks live under Visual Studio, not the plain .NET SDK.
      - name: Locate Visual Studio AppxPackage tasks
        shell: pwsh
        run: |
          $dll = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter Microsoft.Build.AppxPackage.dll -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'Microsoft.Build.Packaging.Pri.Tasks.dll') } |
            Select-Object -First 1
          if (-not $dll) { throw 'Microsoft.Build.AppxPackage.dll not found: this runner cannot build WinUI.' }
          "AppxMSBuildToolsPath=$($dll.DirectoryName)\" | Out-File $env:GITHUB_ENV -Append -Encoding ascii
          "Using $($dll.DirectoryName)"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build publish + installer
        shell: pwsh
        run: .\build.ps1

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KwanteksNICTweaker-Setup
          path: |
            dist/KwanteksNICTweaker-Setup-*.exe
            dist/KwanteksNICTweaker-symbols-*.zip
          if-no-files-found: error
